name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build -warnaserror
      - name: Test (spec files, domain, architecture, API + DEMO 1 golden path on real PostGIS via Testcontainers)
        working-directory: backend
        run: dotnet test --no-build --logger "console;verbosity=normal"
      - name: Vulnerable package check
        working-directory: backend
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "\b(High|Critical)\b" vuln.txt; then echo "::error::High/Critical vulnerable packages found"; exit 1; fi

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - name: Dependency audit (production dependencies, high+)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (analyze, tests, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mfop-field-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  e2e:
    name: "E2E (Docker Compose stack + make seed; every role signs in; M1, M2 and M3 / DEMO 1 web flows; verifier)"
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start stack from a clean state (random secrets)
        run: make up
      - name: Load DEMO 1 data (make seed)
        run: make seed
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Install Playwright Chromium
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Sign in as every seeded user; M1, M2 and M3 / DEMO 1 web flows
        run: make e2e
      - name: Audit verifier on the demo database after the flows (chain, snapshots, seals, stock balances)
        run: make verify-audit
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env down -v

  android:
    name: "Android emulator (real app: sign-in, device approval, PIN, My tasks, QR, field work, evidence upload, approval, revocation)"
    runs-on: ubuntu-latest
    needs: [backend, web, mobile]
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      # The emulator needs ~7.5 GB for its userdata partition; the stack's images and the Android SDK leave too little
      # on a standard runner. Remove preinstalled toolchains this job never uses (the backend is built inside Docker).
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /opt/hostedtoolcache/CodeQL /opt/microsoft
          df -h /
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Start stack from a clean state (random secrets) and load DEMO 1 data (tech1's custody)
        run: |
          make up
          make seed
          docker builder prune -af   # build cache is not needed once the images exist
          df -h /
      - working-directory: mobile
        run: flutter pub get
      - name: "Field-app flow on an Android 14 emulator (the phone reaches the stack as localhost via adb reverse)"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # Each line runs in its own shell.
          script: |
            adb reverse tcp:5080 tcp:5080 && adb reverse tcp:8080 tcp:8080
            cd mobile && flutter drive --driver=test_driver/integration_test.dart --target=integration_test/field_flow_test.dart --dart-define=MFOP_TEST_PASSWORD="$(grep '^MFOP_DEV_USER_PASSWORD=' ../.env | cut -d= -f2-)"
      - name: Screenshots from the device
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-screenshots
          path: mobile/build/android-e2e/
          retention-days: 14
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned CLI; no GitHub API permissions needed)
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar xzf gitleaks.tgz gitleaks && rm gitleaks.tgz
      - name: Scan full git history
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1
