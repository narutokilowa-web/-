name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (.NET build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build -warnaserror
      - name: Test (spec files, architecture, API + real PostGIS via Testcontainers)
        working-directory: backend
        run: dotnet test --no-build --logger "console;verbosity=normal"
      - name: Vulnerable package check
        working-directory: backend
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE "\b(High|Critical)\b" vuln.txt; then echo "::error::High/Critical vulnerable packages found"; exit 1; fi

  web:
    name: Web (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci --no-audit --no-fund
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm run typecheck
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - name: Dependency audit (production dependencies, high+)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  mobile:
    name: Mobile (analyze, tests, debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - working-directory: mobile
        run: flutter pub get
      - working-directory: mobile
        run: flutter analyze
      - working-directory: mobile
        run: flutter test
      - name: Build Android debug APK
        working-directory: mobile
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: mfop-field-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  e2e:
    name: E2E (Docker Compose stack + sign-in for every seeded role)
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start stack from a clean state (random secrets)
        run: make up
      - name: Install Playwright Chromium
        working-directory: web
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Sign in as every seeded user
        run: make e2e
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file .env down -v

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
