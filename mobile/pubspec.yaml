name: mfop_field
description: "MFOP field app (Lean Pilot) — Arabic-first, offline-first field client."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.11.4
  flutter: 3.41.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  crypto: ^3.0.7
  flutter_appauth: ^12.1.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  path: ^1.9.0
  path_provider: ^2.1.6
  sqlite3: ^3.5.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  qr: ^4.0.0 # integration test only: renders the printed label's QR so the device's scanner can decode it
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

# Encrypted local database (docs/lean-pilot/05 §5.8): SQLite3 Multiple Ciphers, bundled through the sqlite3 package's
# build hooks, opened with the SQLCipher v4 scheme and a random key kept in Android Keystore-backed secure storage.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
